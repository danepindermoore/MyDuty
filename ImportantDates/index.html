<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MyCalendar | MyDuty</title>
  <meta name="theme-color" content="#071b3d">
  <meta name="application-name" content="MyDuty">
  <meta name="apple-mobile-web-app-title" content="MyDuty">
  <meta name="description" content="Important upcoming dates. Pay, bidding, roster and annual leave." />
  <link rel="icon" href="../favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="../assets/css/fbp-shared.css?v=6">
  <link rel="stylesheet" href="../assets/css/important-dates.css">
  <script src="../assets/js/fbp-shared.js?v=6"></script>
  <script src="../assets/js/fbp-nav.js"></script>
  <script src="../assets/js/fbp-shell.js?v=6"></script>
  <script src="../assets/js/fbp-page.js"></script>
  <script src="../data/important-dates.js"></script>
</head>
<body class="fbp-theme">
  <main class="fbp-shell">
    <div class="important-dates-content">
      <p class="important-dates-intro">Current month and next month. Important events are shown on their calendar dates.</p>
      <ul class="important-date-legend" aria-label="Calendar categories">
        <li class="legend-pay">Pay and payslips</li>
        <li class="legend-roster">Bidding and roster</li>
        <li class="legend-leave">Annual leave</li>
      </ul>
      <p class="calendar-mobile-hint">On a phone either turn your device to landscape mode or tap a marked day to view it's event details.</p>
      <div id="importantDateCalendars" class="important-date-calendars"></div>
      <p id="importantDatePending" class="important-date-pending" hidden></p>
    </div>
  </main>
  <script>
    FBP.createPage({container:"main",contentSelector:".important-dates-content",layout:"wide",title:"MyCalendar",subtitle:"Important upcoming dates. Pay, bidding, roster and annual leave.",feedbackText:"MyCalendar Feedback",feedbackSubject:"Feedback for MyCalendar",activePage:"importantDates"});
    (function(){
      const root=document.getElementById("importantDateCalendars");
      const events=globalThis.IMPORTANT_DATE_EVENTS||[];
      const today=new Date();today.setHours(0,0,0,0);
      const monthFormatter=new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"});
      const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
      const isoDate=date=>date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
      const weekdayNames=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
      function monthCalendar(monthOffset){
        const month=new Date(today.getFullYear(),today.getMonth()+monthOffset,1);
        const year=month.getFullYear(),monthIndex=month.getMonth();
        const daysInMonth=new Date(year,monthIndex+1,0).getDate();
        const leading=(month.getDay()+6)%7;
        const cellCount=Math.ceil((leading+daysInMonth)/7)*7;
        let rows="";
        for(let start=0;start<cellCount;start+=7){
          rows+="<tr>";
          for(let column=0;column<7;column++){
            const dayNumber=start+column-leading+1;
            if(dayNumber<1||dayNumber>daysInMonth){rows+="<td class=\"calendar-day calendar-day-empty\"></td>";continue}
            const current=new Date(year,monthIndex,dayNumber);
            const key=isoDate(current);
            const dayEvents=events.filter(item=>item.date===key);
            const classes=["calendar-day"];
            if(current<today)classes.push("calendar-day-past");
            const ariaCurrent=key===isoDate(today)?" aria-current=\"date\"":"";
            const eventKinds=[...new Set(dayEvents.map(item=>["pay","roster","leave"].includes(item.kind)?item.kind:"other"))];
            const markerMarkup=eventKinds.map(kind=>"<span class=\"calendar-event-marker marker-"+kind+"\"></span>").join("");
            const eventMarkup=dayEvents.map(item=>{
              const kind=["pay","roster","leave"].includes(item.kind)?item.kind:"other";
              const time=item.time?"<time>"+esc(item.time)+"</time>":"";
              return "<div class=\"calendar-event calendar-event-"+kind+"\" title=\""+esc([item.label,item.context,item.time].filter(Boolean).join(" · "))+"\"><strong>"+esc(item.label)+"</strong>"+(item.context?"<span>"+esc(item.context)+"</span>":"")+time+"</div>";
            }).join("");
            const eventAccess=dayEvents.length?" role=\"button\" tabindex=\"0\" data-date=\""+key+"\" aria-label=\""+esc(new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"numeric",month:"long"}).format(current)+": "+dayEvents.map(item=>item.label).join(", "))+"\"":"";
            if(dayEvents.length)classes.push("calendar-day-has-events");
            rows+="<td class=\""+classes.join(" ")+"\""+ariaCurrent+eventAccess+"><div class=\"calendar-day-number\"><time datetime=\""+key+"\">"+dayNumber+"</time></div><div class=\"calendar-day-markers\" aria-hidden=\"true\">"+markerMarkup+"</div><div class=\"calendar-day-events\">"+eventMarkup+"</div></td>";
          }
          rows+="</tr>";
        }
        return "<section class=\"fbp-panel important-month\"><h2>"+monthFormatter.format(month)+"</h2><div class=\"calendar-scroll\"><table class=\"month-calendar\"><caption class=\"visually-hidden\">"+monthFormatter.format(month)+" important dates</caption><thead><tr>"+weekdayNames.map(name=>"<th scope=\"col\"><abbr title=\""+name+"\">"+name.slice(0,3)+"</abbr></th>").join("")+"</tr></thead><tbody>"+rows+"</tbody></table></div><div class=\"calendar-selected-events\" aria-live=\"polite\" hidden></div></section>";
      }
      root.innerHTML=monthCalendar(0)+monthCalendar(1);
      const showDateEvents=(cell)=>{
        if(!cell?.dataset.date)return;
        const monthCard=cell.closest(".important-month"),panel=monthCard?.querySelector(".calendar-selected-events");
        const date=new Date(cell.dataset.date+"T12:00:00"),dateLabel=new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"numeric",month:"long"}).format(date);
        const selected=events.filter(item=>item.date===cell.dataset.date);
        if(!panel)return;
        panel.hidden=false;
        panel.innerHTML="<h3>"+esc(dateLabel)+"</h3>"+(selected.length?"<ul>"+selected.map(item=>{const kind=["pay","roster","leave"].includes(item.kind)?item.kind:"other";return "<li class=\"calendar-event-detail detail-"+kind+"\"><strong>"+esc(item.label)+"</strong>"+(item.context?"<span>"+esc(item.context)+"</span>":"")+(item.time?"<time>"+esc(item.time)+"</time>":"")+"</li>"}).join("")+"</ul>":"<p>No important dates on this day.</p>");
        monthCard.querySelectorAll(".calendar-day-selected").forEach(day=>day.classList.remove("calendar-day-selected"));cell.classList.add("calendar-day-selected");
      };
      root.addEventListener("click",event=>{const cell=event.target.closest("td.calendar-day-has-events");if(cell)showDateEvents(cell)});
      root.addEventListener("keydown",event=>{if(event.key!=="Enter"&&event.key!==" ")return;const cell=event.target.closest("td.calendar-day-has-events");if(!cell)return;event.preventDefault();showDateEvents(cell)});
      const pending=globalThis.IMPORTANT_DATE_PENDING||[];
      if(pending.length){
        const note=document.getElementById("importantDatePending");
        note.hidden=false;
        note.textContent="Annual leave dates still to be added: "+pending.join(", ")+".";
      }
    })();
  </script>
</body>
</html>
